# Docker Profile - Uses Docker container hostnames
# Run with: SPRING_PROFILES_ACTIVE=docker

spring:
  datasource:
    url: jdbc:postgresql://postgres-products:5433/commerce_products_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

  elasticsearch:
    uris: http://elasticsearch-product:9200

  data:
    redis:
      host: redis
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://commerce-service-discovery:8761/eureka/

logging:
  level:
    com.social.product: INFO